[build-system]
requires = ["pbr>=7.1.0"]
build-backend = "pbr.build"

[project]
name = "sphinxcontrib-pecanwsme"
description = "A Sphinx extension for documenting APIs built with Pecan and WSME"
authors = [
    {name = "Doug Hellmann", email = "doug@doughellmann.com"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
dynamic = ["version"]
dependencies = [
    "sphinxcontrib-httpdomain"
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
]
keywords = [
    "documentation",
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/sphinx-contrib/pecanwsme"
Repository = "https://github.com/sphinx-contrib/pecanwsme"
Issues = "https://github.com/sphinx-contrib/pecanwsme/issues"

[tool.setuptools.packages.find]
include = ["sphinxcontrib*"]
